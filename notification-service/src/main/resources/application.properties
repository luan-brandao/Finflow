spring.application.name=notification-service
server.port=8083

# JWT Secret matching other microservices
jwt.secret=${JWT_SECRET:SUCyqUK/gHFUSeNnni37KZHllM1w6+43ibwhqcXlloU=}

# Database Connection (Postgres container for notifications)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-finance:5432/finflow_notifications}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# Eureka Discovery
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
