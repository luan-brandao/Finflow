services:

  postgres:
    image: postgres:16
    container_name: finflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: finflow_users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finflow_users"]
      interval: 5s
      timeout: 5s
      retries: 5


  postgres-finance:
    image: postgres:16
    container_name: finflow-postgres-finance
    restart: unless-stopped

    environment:
      POSTGRES_DB: finflow_finance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_finance_data:/var/lib/postgresql/data
      - ./postgres-finance-init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finflow_finance"]
      interval: 5s
      timeout: 5s
      retries: 5


  rabbitmq:
    image: rabbitmq:3-management
    container_name: finflow-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  eureka-server:
    build:
      context: ./eureka-server

    container_name: finflow-eureka-server
    restart: unless-stopped

    ports:
      - "8761:8761"


  user-service:
    build:
      context: ./user-service

    container_name: finflow-user-service
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/finflow_users
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: SUCyqUK/gHFUSeNnni37KZHllM1w6+43ibwhqcXlloU=


  finance-service:
    build:
      context: ./finance-service

    container_name: finflow-finance-service
    restart: unless-stopped

    depends_on:
      postgres-finance:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started

    ports:
      - "8082:8082"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-finance:5432/finflow_finance
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      JWT_SECRET: SUCyqUK/gHFUSeNnni37KZHllM1w6+43ibwhqcXlloU=


  notification-service:
    build:
      context: ./notification-service

    container_name: finflow-notification-service
    restart: unless-stopped

    depends_on:
      postgres-finance:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started

    ports:
      - "8083:8083"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-finance:5432/finflow_notifications
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      JWT_SECRET: SUCyqUK/gHFUSeNnni37KZHllM1w6+43ibwhqcXlloU=


  api-gateway:
    build:
      context: ./api-gateway

    container_name: finflow-api-gateway
    restart: unless-stopped

    depends_on:
      eureka-server:
        condition: service_started

    ports:
      - "8081:8081"


volumes:
  postgres_data:
  postgres_finance_data: