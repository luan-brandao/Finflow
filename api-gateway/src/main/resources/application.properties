spring.application.name=api-gateway

server.port=8081

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka

spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/users/**

spring.cloud.gateway.server.webmvc.routes[1].id=user-service-auth
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webmvc.routes[2].id=finance-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://FINANCE-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/categories/**

spring.cloud.gateway.server.webmvc.routes[3].id=finance-service-transactions
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://FINANCE-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/transactions/**

spring.cloud.gateway.server.webmvc.routes[4].id=finance-service-dashboard
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://FINANCE-SERVICE
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/dashboard/**